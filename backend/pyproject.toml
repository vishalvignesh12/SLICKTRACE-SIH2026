[project]
name = "oil-spill-backend"
version = "0.1.0"
description = "Backend for Oil Spill Detection & AIS Attribution Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "geoalchemy2>=0.14.7",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "passlib[bcrypt]>=1.7.4",
    "shapely>=2.0.3",
    "geopandas>=0.14.3",
    "pandas>=2.2.1",
    "pyproj>=3.6.1",
    "geojson>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "asyncpg>=0.31.0",
    "pytest>=9.1.1",
    "typing-extensions>=4.16.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "black>=24.2.0",
    "isort>=5.13.2"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
